name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Terraform And Republish Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip boto3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/bruce-quotes-github-terraform-apply
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init
        timeout-minutes: 10

      - name: Package And Upload Lambda Artifacts
        run: python tools/publish_lambda.py

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false

      - name: Republish Static Site
        if: steps.apply.outcome == 'success'
        run: |
          FUNCTION_NAME="$(terraform output -raw page_generator_function_name)"
          python tools/invoke_page_generator.py \
            --region "us-east-2" \
            --function-name "${FUNCTION_NAME}"

      - name: Create Job Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy Results"
            echo
            echo "**Status:** $JOB_STATUS"
            echo "**Ref:** main"
            echo "**Commit:** $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
