name: Expand IAM Wildcards

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  expand-wildcards:
    runs-on: ubuntu-latest
    steps:
      - name: Expand IAM Wildcards
        uses: thekbb/expand-iam-wildcards@b9feb971deb1e5a09437bc12584dddfe190d6376 # v2.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
